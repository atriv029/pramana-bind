[project]
name = "pramana-bind"
version = "0.1.0"
description = "Typed, replayable citation verdicts from Nyaya inference structure"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.11", "cryptography>=42", "fastapi>=0.115", "pravrudhi", "pravrudhi-kernel"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramana_bind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
